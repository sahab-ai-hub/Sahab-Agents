[options]
; ── Server ──────────────────────────────────────────────────────────────────
http_port = 8069
proxy_mode = True

; ── Database ─────────────────────────────────────────────────────────────────
; These values are overridden at runtime by the environment variables that
; Railway injects (DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME).
; Odoo's official entrypoint script maps those variables automatically.
db_host = ${DB_HOST}
db_port = ${DB_PORT}
db_user = ${DB_USER}
db_password = ${DB_PASSWORD}
db_name = ${DB_NAME}

; ── Addons ───────────────────────────────────────────────────────────────────
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; ── Logging ──────────────────────────────────────────────────────────────────
logfile = False
log_level = info
