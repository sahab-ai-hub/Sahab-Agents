name: Deploy to Railway

on:
  push:
    branches:
      - odoo-19

jobs:
  deploy:
    name: Deploy odoo-dev to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: f5f5ffd0-83f0-4299-bf3b-0bfa8dbb98f1
          RAILWAY_SERVICE_ID: c88d43fd-38d2-462d-aa76-6ce507987934
