name: Deploy to Railway

on:
  push:
    branches:
      - odoo-19

jobs:
  deploy:
    name: Deploy odoo-dev to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: hubeadmin/action-railway@v1.2
        with:
          service_id: c88d43fd-38d2-462d-aa76-6ce507987934
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
