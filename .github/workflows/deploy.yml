name: Deploy to Railway

on:
  push:
    branches:
      - odoo-19

jobs:
  deploy:
    name: Deploy odoo-dev to Railway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/deploy-action@v1
        with:
          service: odoo-dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
